name: iOS Build (FormulaLab)

# 配方引擎 FormulaLab — iOS 出包流水线 (不需要本地 Mac)
#
# 工程结构: apps/taro/ios (React Native 0.73 原生工程, Taro RN 外壳)
# JS bundle 由 Xcode 的 "Bundle React Native code and images" 阶段生成:
#   node_modules/react-native/scripts/react-native-xcode.sh
#   -> 走 apps/taro/metro.config.js -> Taro 的 rn-supporter transformer 接管
#
# 产出:
#   1) 模拟器 .app —— 始终产出, 不需要任何证书, 用 Release 配置 (含 JS bundle, 可直接跑)
#   2) 真机 .ipa  —— 仅当仓库配置了签名 secrets 时产出
#
# 需要在仓库 Settings -> Secrets 配置 (可选, 不配也能出模拟器包):
#   IOS_CERT_P12_BASE64    开发者证书 .p12 的 base64
#   IOS_CERT_PASSWORD      p12 密码
#   IOS_PROVISION_PROFILE  描述文件的 base64
#   IOS_PROVISION_PROFILE_NAME  描述文件里的 Profile Name
#   IOS_TEAM_ID            Apple Team ID
#   IOS_BUNDLE_ID          Bundle ID (默认 com.formulalab.app)

on:
  workflow_dispatch:
    inputs:
      build_device:
        description: "真机 IPA (需要签名 secrets) / 模拟器 .app"
        type: choice
        options: ["simulator", "device"]
        default: simulator
  push:
    branches: [master, main]
    paths:
      - "apps/taro/**"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS
    runs-on: macos-14
    env:
      APP_DIR: apps/taro
      IOS_DIR: apps/taro/ios
      SCHEME: FormulaLab
      BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID || 'com.formulalab.app' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        working-directory: ${{ env.APP_DIR }}
        run: npm install --no-audit --no-fund

      - name: Install CocoaPods
        run: |
          set -e
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods --no-document
          fi
          pod --version

      - name: Pod install
        working-directory: ${{ env.APP_DIR }}/ios
        run: |
          set -e
          set -o pipefail
          pod install --repo-update 2>&1 | tee pod-install.log

      # ---------------------------------------------------------------------
      # 模拟器包: Release 配置 (会打 JS bundle), 关闭签名
      # ---------------------------------------------------------------------
      - name: Build simulator app
        if: ${{ github.event_name == 'push' || inputs.build_device == 'simulator' }}
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          set -o pipefail
          rm -rf build/DerivedData
          xcodebuild \
            -workspace ios/FormulaLab.xcworkspace \
            -scheme "${{ env.SCHEME }}" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee build/xcodebuild-sim.log
          mkdir -p build/artifact
          APP=$(find build/DerivedData/Build/Products -maxdepth 3 -name "*.app" | head -1)
          echo "APP=$APP"
          test -n "$APP"
          # 打 zip, 方便直接下载/上传 TestFlight
          ditto -c -k --sequesterRsrc --keepParent "$APP" build/artifact/FormulaLab-simulator.app.zip

      - name: Upload simulator app
        if: ${{ github.event_name == 'push' || inputs.build_device == 'simulator' }}
        uses: actions/upload-artifact@v4
        with:
          name: FormulaLab-ios-simulator
          path: ${{ env.APP_DIR }}/build/artifact/FormulaLab-simulator.app.zip
          retention-days: 14

      # ---------------------------------------------------------------------
      # 真机 IPA: 需要签名 secrets
      # ---------------------------------------------------------------------
      - name: Restore signing assets
        if: ${{ inputs.build_device == 'device' }}
        env:
          CERT: ${{ secrets.IOS_CERT_P12_BASE64 }}
          PROFILE: ${{ secrets.IOS_PROVISION_PROFILE }}
        run: |
          set -e
          mkdir -p "${{ env.APP_DIR }}/build/certs"
          if [ -z "$CERT" ] || [ -z "$PROFILE" ]; then
            echo "::error::未配置 IOS_CERT_P12_BASE64 / IOS_PROVISION_PROFILE, 无法出真机包"
            exit 1
          fi
          echo "$CERT" | base64 --decode > "${{ env.APP_DIR }}/build/certs/dev.p12"
          echo "$PROFILE" | base64 --decode > "${{ env.APP_DIR }}/build/certs/Provision.mobileprovision"
          security create-keychain -p actions -s formulalab.keychain
          security default-keychain -s formulalab.keychain
          security unlock-keychain -p actions
          security import "${{ env.APP_DIR }}/build/certs/dev.p12" -k formulalab.keychain \
            -P "${{ secrets.IOS_CERT_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions formulalab.keychain >/dev/null
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "${{ env.APP_DIR }}/build/certs/Provision.mobileprovision" \
             ~/Library/MobileDevice/Provisioning\ Profiles/
          # 覆盖工程里的 bundle id 与 team
          find "${{ env.IOS_DIR }}" -name "project.pbxproj" -exec \
            sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = ${{ env.BUNDLE_ID }};/g" {} \;
          find "${{ env.IOS_DIR }}" -name "project.pbxproj" -exec \
            sed -i '' "s/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = ${{ secrets.IOS_TEAM_ID }};/g" {} \;

      - name: Archive & export IPA
        if: ${{ inputs.build_device == 'device' }}
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          set -o pipefail
          xcodebuild \
            -workspace ios/FormulaLab.xcworkspace \
            -scheme "${{ env.SCHEME }}" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/FormulaLab.xcarchive \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM="${{ secrets.IOS_TEAM_ID }}" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="${{ secrets.IOS_PROVISION_PROFILE_NAME || 'FormulaLab' }}" \
            archive | tee build/xcodebuild-archive.log
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>development</string>
            <key>teamID</key><string>${{ secrets.IOS_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>destination</key><string>export</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${{ env.BUNDLE_ID }}</key>
              <string>${{ secrets.IOS_PROVISION_PROFILE_NAME || 'FormulaLab' }}</string>
            </dict>
          </dict>
          </plist>
          EOF
          mkdir -p build/ipa
          xcodebuild -exportArchive \
            -archivePath build/FormulaLab.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/ipa
          ls -la build/ipa

      - name: Upload IPA
        if: ${{ inputs.build_device == 'device' }}
        uses: actions/upload-artifact@v4
        with:
          name: FormulaLab-ios-ipa
          path: ${{ env.APP_DIR }}/build/ipa/*.ipa
          retention-days: 30
