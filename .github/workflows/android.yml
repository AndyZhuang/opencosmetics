name: Android Build (FormulaLab)

# 配方引擎 FormulaLab — Android 出包流水线
#
# 工程结构: apps/taro/android (React Native 0.73 原生工程, Taro RN 外壳)
# 出包入口: apps/taro/scripts/build-android.mjs
#
# 产出:
#   1) release APK —— 没配置正式密钥时用 debug keystore 签, 可直接装到真机联调
#   2) release AAB —— 上架 Google Play / 国内应用商店用
#
# 正式签名 (可选, 在仓库 Settings -> Secrets 配置):
#   ANDROID_KEYSTORE_BASE64   keystore 文件的 base64
#   ANDROID_KEY_ALIAS         密钥别名
#   ANDROID_KEY_PASSWORD      密钥口令 (store 与 key 共用)

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - "apps/taro/**"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest
    env:
      APP_DIR: apps/taro
      # 注意: secrets 上下文不能直接用在 if: 表达式里 (GitHub 会报
      # "Unrecognized named-value: 'secrets'"), 必须先挂到 env 再判断。
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # runner 镜像自带 Android SDK + sdkmanager (ANDROID_HOME 已设好)。
      # 不用 android-actions/setup-android: v3 会因为 sdkmanager 报
      # "Failed to find package 'tools'" 直接把整个 step 判失败。
      - name: Setup Android SDK
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          # runner 镜像的 sdkmanager 不在 PATH 里, 得自己找
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::找不到 sdkmanager"
            exit 1
          fi
          chmod +x "$SDKMANAGER" 2>/dev/null || true
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/taro/android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ${{ env.APP_DIR }}/node_modules
          key: taro-npm-${{ runner.os }}-${{ hashFiles('apps/taro/package-lock.json') }}

      - name: Install deps
        working-directory: ${{ env.APP_DIR }}
        run: npm install --no-audit --no-fund

      - name: Restore signing key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          KEYSTORE: ${{ env.ANDROID_KEYSTORE_BASE64 }}
          ALIAS: ${{ env.ANDROID_KEY_ALIAS }}
          PASSWORD: ${{ env.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          echo "$KEYSTORE" | base64 --decode > "${{ env.APP_DIR }}/android/app/fl-release.keystore"
          cat > "${{ env.APP_DIR }}/android/keystore.properties" <<EOF
          FORMULALAB_KEYSTORE=fl-release.keystore
          FORMULALAB_KEYSTORE_PASSWORD=$PASSWORD
          FORMULALAB_KEY_ALIAS=$ALIAS
          FORMULALAB_KEY_PASSWORD=$PASSWORD
          EOF

      - name: Build APK + AAB
        working-directory: ${{ env.APP_DIR }}
        run: node scripts/build-android.mjs assembleRelease bundleRelease --console=plain

      - name: Collect artifacts
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          set -e
          find app/build/outputs -name "*.apk" -o -name "*.aab" | grep -v intermediates || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FormulaLab-android-apk
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: FormulaLab-android-aab
          path: ${{ env.APP_DIR }}/android/app/build/outputs/bundle/**/*.aab
          retention-days: 30
