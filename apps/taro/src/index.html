<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no,address=no" />
    <meta name="theme-color" content="#FAFAF8" />
    <meta name="description" content="配方引擎 FormulaLab — 美妆法规/配方/成本工作台" />
    <!--
      favicon 用内联 SVG data-URI, 不落二进制资源。
      没有这个 link 的话浏览器会自己去请求 /favicon.ico, 静态站上必然 404。
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230F4C5C'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='30' font-weight='700' fill='%23FAFAF8' text-anchor='middle'%3EFL%3C/text%3E%3C/svg%3E"
    />
    <title>配方引擎 FormulaLab</title>
    <script><%= htmlWebpackPlugin.options.script %></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
